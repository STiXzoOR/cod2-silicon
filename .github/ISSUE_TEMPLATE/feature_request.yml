name: Feature request
description: Propose an improvement with a concrete use case.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Please check docs/ROADMAP.md first. Do not include private identifiers or game assets.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain the player or developer experience and any compatibility constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
