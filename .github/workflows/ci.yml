name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 tools/check_trace_guards.py
      - run: python3 -m unittest discover -s tests/input -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tools/datagen -p test_datagen.py -v
      - run: python3 tests/rendering/shader_setup.py
      - run: python3 -m unittest discover -s tests/lp64/renderer -p test_wine_draw_trace.py -v
      - run: shellcheck tools/ci/*.sh tools/macos/*.sh

  x86-reference:
    name: x86 ILP32 byte-for-byte reference (410342a versus head)
    runs-on: ubuntu-latest
    # A clean container avoids the hosted image's preinstalled amd64 GLib
    # development packages, which conflict with the i386 multilib set.
    container: ubuntu:24.04
    # Upstream 410342a itself does not compile with GCC 14 on Linux (MSVC
    # __stdcall/__cdecl spellings in bg_misc.c/bg_pmove.c), so the before/after
    # comparison cannot run yet. Non-blocking until that is resolved; see the
    # tracking issue linked from CONTRIBUTING.md.
    continue-on-error: true
    steps:
      - name: README multilib build dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 build-essential gcc-14-multilib g++-14-multilib cmake pkg-config \
            libsdl2-dev:i386 libgl1-mesa-dev:i386 libx11-dev:i386 \
            libcurl4-openssl-dev:i386 zlib1g-dev:i386 libstdc++6:i386
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build both snapshots and compare all game objects and both binaries
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: bash tools/ci/compare-x86.sh
      - name: Preserve diagnostics only (no game data or executables)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x86-reference-logs
          path: |
            output/x86-reference/*.log
            output/x86-reference/*.txt

  macos-arm64:
    name: Apple silicon Release clients and data-free fixtures
    # macos-26 is the standard GitHub-hosted Apple silicon runner.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ASAN_OPTIONS: symbolize=0
      UBSAN_OPTIONS: halt_on_error=1
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require native arm64 and prepare SDL development libraries
        run: |
          test "$(uname -m)" = arm64
          command -v cmake
          command -v clang
          brew install sdl2-compat
          command -v sdl2-config
      - name: Config Studio catalog coverage
        run: |
          python3 -m unittest discover -s tools/catalog -v
          python3 tools/catalog/catalog.py check --source-root . --catalog launcher/Resources/ConfigCatalog.json --mode stock
          python3 tools/catalog/catalog.py check --source-root . --catalog launcher/Resources/ConfigCatalog.json --mode cod2x
      - name: Synthetic ABI checker tests
        run: |
          python3 tools/abi/test_audit.py
          python3 tools/abi/test_imports.py
          python3 tools/abi/test_bit_conversions.py
      - name: Full CoD2x fixtures
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: COD2X_SANITIZERS=1 sh tests/cod2x/run_full.sh
      - name: Native CoD2x integration fixtures
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: sh tests/cod2x/run_native.sh
      - name: SDK identity fixture
        if: ${{ !cancelled() }}
        run: sh tests/online/sdk_identity.sh
      - name: Synthetic renderer, performance, HUD and FX fixtures
        if: ${{ !cancelled() }}
        run: |
          status=0
          run_fixture() { "$@" || status=1; }
          run_fixture sh tests/lp64/renderer/run.sh
          # run_shader_raster.sh, run_texture_mips.sh, run_volume_upload.sh and
          # run_depth_surface.py need
          # an accelerated CGL pixel format, which hosted runners lack; local gate only.
          run_fixture python3 tests/perf/run.py
          run_fixture python3 tests/platform/run_hud_matrices.py
          run_fixture python3 tests/platform/run_impact_marks.py
          run_fixture python3 tests/platform/run_fx_events.py
          run_fixture python3 tests/platform/run_fx_primitives.py
          run_fixture python3 tests/platform/run_fx_cloud.py
          run_fixture sh tests/platform/run_dedicated_fx.sh
          exit "$status"
      - name: Native platform CTest with and without sanitizers
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: |
          for sanitizers in ON OFF; do
            build="output/platform-$sanitizers"
            cmake -S tests/platform -B "$build" -DCMAKE_BUILD_TYPE=Debug \
              -DCOD2_PLATFORM_SANITIZERS="$sanitizers"
            cmake --build "$build" --parallel 3
            ctest --test-dir "$build" --output-on-failure
          done
      # Clean checkouts compile the committed build/lp64_gen typed-data snapshot;
      # no proprietary input is fetched or needed.
      - name: Configure and build stock Release client
        id: stock
        if: ${{ !cancelled() }}
        run: |
          cmake -S . -B build-macos -DCOD2_X64=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-macos --parallel 3 --target cod2_macos
      - name: Configure and build CoD2x Release client
        id: codx
        if: ${{ !cancelled() }}
        run: |
          cmake -S . -B build-macos-codx -DCOD2_X64=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCOD2_FEATURE_CFLAGS=-DCOD2_CODX=1
          cmake --build build-macos-codx --parallel 3 --target cod2_macos
      - name: Data-free function and renderer callback ABI audits
        if: ${{ !cancelled() && steps.stock.outcome == 'success' && steps.codx.outcome == 'success' }}
        run: |
          for build in build-macos build-macos-codx; do
            out="output/abi-$build"
            mkdir -p "$out"
            python3 tools/abi/audit.py "$build/compile_commands.json" \
              --output "$out/functions.json" --baseline tools/abi/baseline.json
            python3 tools/abi/callback_tables.py "$build/compile_commands.json" \
              --audit "$out/functions.json" --baseline tools/abi/callback-baseline.json \
              --output "$out/callbacks.json"
            python3 tools/abi/astdump_strict.py "$build/compile_commands.json"
          done
          # imports.py / full check.sh require a proprietary binary: local gate only.
      - name: Keep assertions enabled in fixture compile commands
        if: ${{ !cancelled() && steps.stock.outcome == 'success' && steps.codx.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for build in ['build-macos', 'build-macos-codx']:
              path = Path(build) / 'compile_commands.json'
              path.with_name('compile_commands.engine.json').write_bytes(path.read_bytes())
              rows = json.loads(path.read_text())
              for row in rows:
                  if 'command' in row:
                      row['command'] = row['command'].replace(' -DNDEBUG', ' -UNDEBUG')
                  if 'arguments' in row:
                      row['arguments'] = ['-UNDEBUG' if x == '-DNDEBUG' else x for x in row['arguments']]
              path.write_text(json.dumps(rows))
          PY
      - name: Source-based game, script, network and reconstruction fixtures
        if: ${{ !cancelled() && steps.stock.outcome == 'success' && steps.codx.outcome == 'success' }}
        run: |
          python3 tests/camera/run_snapshot.py --compile-db build-macos/compile_commands.engine.json \
            --output "$RUNNER_TEMP/snapshot-stock"
          python3 tests/camera/run_snapshot.py --compile-db build-macos-codx/compile_commands.engine.json \
            --output "$RUNNER_TEMP/snapshot-codx"
          python3 tests/camera/run_prediction.py --compile-db build-macos/compile_commands.engine.json \
            --output "$RUNNER_TEMP/prediction-stock"
          python3 tests/camera/run_prediction.py --compile-db build-macos-codx/compile_commands.engine.json \
            --output "$RUNNER_TEMP/prediction-codx"
          python3 tests/camera/run_events.py --compile-db build-macos/compile_commands.engine.json \
            --output "$RUNNER_TEMP/events-stock"
          python3 tests/camera/run_events.py --compile-db build-macos-codx/compile_commands.engine.json \
            --output "$RUNNER_TEMP/events-codx"
          python3 tests/camera/run_items.py --compile-commands build-macos/compile_commands.engine.json \
            --output "$RUNNER_TEMP/items-stock"
          python3 tests/camera/run_items.py --compile-commands build-macos-codx/compile_commands.engine.json \
            --output "$RUNNER_TEMP/items-codx"
          python3 tests/camera/run_server_commands.py --compile-db build-macos/compile_commands.engine.json \
            --output "$RUNNER_TEMP/server-commands-stock"
          python3 tests/camera/run_server_commands.py --compile-db build-macos-codx/compile_commands.engine.json \
            --output "$RUNNER_TEMP/server-commands-codx"
          python3 tests/lp64/renderer/run_font_icons.py --compile-db build-macos/compile_commands.engine.json \
            --output "$RUNNER_TEMP/run_font_icons-stock"
          python3 tests/lp64/renderer/run_font_icons.py --compile-db build-macos-codx/compile_commands.engine.json \
            --output "$RUNNER_TEMP/run_font_icons-codx"
          python3 tests/lp64/renderer/run_model.py --compile-db build-macos/compile_commands.engine.json \
            --output "$RUNNER_TEMP/run_model-stock"
          python3 tests/lp64/renderer/run_model.py --compile-db build-macos-codx/compile_commands.engine.json \
            --output "$RUNNER_TEMP/run_model-codx"
          python3 tests/lp64/renderer/run_player_skeleton.py --compile-db build-macos/compile_commands.engine.json \
            --output "$RUNNER_TEMP/run_player_skeleton-stock"
          python3 tests/lp64/renderer/run_player_skeleton.py --compile-db build-macos-codx/compile_commands.engine.json \
            --output "$RUNNER_TEMP/run_player_skeleton-codx"
          python3 tests/lp64/renderer/run_sun.py --compile-db build-macos/compile_commands.engine.json \
            --output "$HOME/Library/Application Support/CoD2-native-decomp/F2-sun.noindex/ci-stock"
          python3 tests/lp64/renderer/run_sun.py --compile-db build-macos-codx/compile_commands.engine.json \
            --output "$HOME/Library/Application Support/CoD2-native-decomp/F2-sun.noindex/ci-codx"
          python3 tests/lp64/renderer/run_imagefilter.py --compile-db build-macos/compile_commands.engine.json \
            --output "$HOME/Library/Application Support/CoD2-native-decomp/F2-filters.noindex/ci-stock"
          python3 tests/lp64/renderer/run_imagefilter.py --compile-db build-macos-codx/compile_commands.engine.json \
            --output "$HOME/Library/Application Support/CoD2-native-decomp/F2-filters.noindex/ci-codx"
          python3 tests/lp64/renderer/run_post_effects.py --compile-db build-macos/compile_commands.engine.json \
            --output "$RUNNER_TEMP/post-effects-stock"
          python3 tests/lp64/renderer/run_post_effects.py --compile-db build-macos-codx/compile_commands.engine.json \
            --output "$RUNNER_TEMP/post-effects-codx"
          python3 tests/lp64/renderer/run_lights.py --compile-db build-macos/compile_commands.engine.json \
            --output "$HOME/Library/Application Support/CoD2-native-decomp/F2-lights.noindex/ci-stock"
          python3 tests/lp64/renderer/run_lights.py --compile-db build-macos-codx/compile_commands.engine.json \
            --output "$HOME/Library/Application Support/CoD2-native-decomp/F2-lights.noindex/ci-codx"
          python3 tests/lp64/renderer/run_light_loader.py --compile-db build-macos/compile_commands.engine.json \
            --output "$RUNNER_TEMP/light-loader-stock"
          python3 tests/lp64/renderer/run_light_loader.py --compile-db build-macos-codx/compile_commands.engine.json \
            --output "$RUNNER_TEMP/light-loader-codx"
          python3 tests/lp64/renderer/run_utils.py --compile-db build-macos/compile_commands.engine.json \
            --output "$HOME/Library/Application Support/CoD2-native-decomp/F2-utils.noindex/ci-stock"
          python3 tests/lp64/renderer/run_utils.py --compile-db build-macos-codx/compile_commands.engine.json \
            --output "$HOME/Library/Application Support/CoD2-native-decomp/F2-utils.noindex/ci-codx"
          python3 tests/lp64/game/run.py --build build-macos
          python3 tests/lp64/script/run.py
          python3 tests/online/run.py build-macos/compile_commands.json
          python3 tests/lp64/ui/run.py --build build-macos
          python3 tests/lp64/ui/run.py --build build-macos-codx
          python3 tests/input/run.py --self-test --compile-db build-macos/compile_commands.json \
            --output "$HOME/Library/Application Support/CoD2-native-ws42/ci-input-stock"
          python3 tests/input/run.py --self-test --compile-db build-macos-codx/compile_commands.json \
            --output "$HOME/Library/Application Support/CoD2-native-ws42/ci-input-codx"
          # fixes13 timing cases live in CoD2x-only code; the stock database
          # preprocesses them away, so run it on the CoD2x build as the gate does.
          python3 tests/fixes13/run.py --build build-macos-codx
      - name: Preserve diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-diagnostics
          if-no-files-found: ignore
          path: |
            output/abi-*/functions.json
            output/abi-*/callbacks.json
            output/platform-*/Testing/Temporary/LastTest.log
