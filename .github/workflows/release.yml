name: Package macOS arm64

on:
  pull_request:
  push:
    tags: ['v*']
  # Dry run: package on the hosted runner and keep the zip as a workflow
  # artifact, without creating or touching a release.
  workflow_dispatch:
    inputs:
      version:
        description: Version stamped into the dry-run app (N.N.N)
        default: 0.0.0

permissions:
  contents: read

jobs:
  package:
    # GitHub's macos-26 runner uses Apple silicon and the supported Xcode 26 toolchain.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify supported build host
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          test "$(xcrun --show-sdk-version | cut -d. -f1)" -ge 26
      - name: Build from the committed snapshot, audit and ad-hoc sign
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then version=$DRY_RUN_VERSION; elif [ "$GITHUB_EVENT_NAME" = push ]; then version=${GITHUB_REF_NAME#v}; else version=$(cat RELEASE_VERSION); fi
          ./scripts/package-release.sh --version "$version"
      - name: Verify bundle and run launcher core on macOS 26
        run: |
          python3 tests/packaging/launcher_bundle.py "build/package/release/CoD2 Silicon.app"
          ./scripts/build-launcher.sh "$RUNNER_TEMP/launcher-core" --test
          "$RUNNER_TEMP/launcher-core/LauncherTests" tests/launcher/fixtures
          python3 tests/packaging/first_run.py
      - name: Keep verified assets as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cod2-silicon-dry-run
          path: dist/
  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cod2-silicon-dry-run
          path: dist
      - name: Upload assets to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --draft \
              --title "CoD2 Silicon ${GITHUB_REF_NAME#v}" \
              --notes 'Apple silicon, macOS 26+. Ad-hoc signed and not notarized. See the README for game data and Gatekeeper instructions.'
          fi
