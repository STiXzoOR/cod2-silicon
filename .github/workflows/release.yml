name: Draft macOS arm64 release

on:
  push:
    tags: ['v*']
  # Dry run: package on the hosted runner and keep the zip as a workflow
  # artifact, without creating or touching a release.
  workflow_dispatch:
    inputs:
      version:
        description: Version stamped into the dry-run app (N.N.N)
        default: 0.0.0

permissions:
  contents: write

jobs:
  package:
    # GitHub's standard macos-15 runner is Apple silicon (M1).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build from the committed snapshot, audit and ad-hoc sign
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then version=$DRY_RUN_VERSION; else version=${GITHUB_REF_NAME#v}; fi
          ./scripts/package-release.sh --version "$version"
      - name: Keep dry-run assets as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cod2-silicon-dry-run
          path: dist/
      - name: Upload assets to a draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --draft \
              --title "CoD2 Silicon ${GITHUB_REF_NAME#v}" \
              --notes 'Apple silicon, macOS 13+. Ad-hoc signed and not notarized. See the README for game data and Gatekeeper instructions.'
          fi
