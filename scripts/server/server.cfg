// Private writable fs_homepath/main/server.cfg. Keep owned main/ data read-only.
set sv_hostname "CoD2 Silicon LAN"
set sv_maxclients "8"
set sv_punkbuster "0"
set sv_pure "1"
set sv_allowDownload "0"
set sv_fps "20"
set sv_maxRate "25000"
set g_gametype "dm"
set scr_dm_timelimit "10"
set scr_dm_scorelimit "0"
set g_log "games_mp.log"
set g_logSync "1"
set logfile "0"
// Empty disables rcon. Set a private password here, never on a command line.
set rcon_password ""
set sv_mapRotation "gametype dm map mp_toujane gametype dm map mp_carentan"
// Public listing is an install-time opt-in: cod2-silicon-server install --public.
// dedicated 1 suppresses all heartbeats. Empty master entries disable them.
set sv_master1 "cod2master.activision.com:20710"
set sv_master2 ""
set sv_master3 ""
set sv_master4 ""
set sv_master5 ""
